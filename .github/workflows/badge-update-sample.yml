name: Update Dynamic Badges

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-badges:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run linter and compute metrics
        id: compute_metrics
        run: |
          echo "Running standard checks..."
          npm run lint || true
          echo "status=passing" >> $GITHUB_ENV
          echo "color=brightgreen" >> $GITHUB_ENV

      - name: Create dynamic badge JSON
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET_TOKEN }}
          gistID: adbd0eaa95a15c5cfbc78a3d70a8f910
          filename: badge.json
          label: Custom Build
          message: ${{ env.status }}
          color: ${{ env.color }}
          namedLogo: github
