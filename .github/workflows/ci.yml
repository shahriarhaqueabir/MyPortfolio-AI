name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check "src/**/*.{ts,tsx}"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E Tests
        run: npm run test
        env:
          # Mock the API key for CI tests so the TTS route doesn't crash
          ELEVENLABS_API: "sk_ci_mock_key"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

          
      # Upload to Gist for Shields.io Dynamic Endpoint
      # Endpoint URL format: https://img.shields.io/endpoint?url=https://gist.githubusercontent.com/USERNAME/GIST_ID/raw/badge.json
      - name: Create Dynamic Badge JSON
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET_TOKEN }} # Require a Personal Access Token with 'gist' scope
          gistID: adbd0eaa95a15c5cfbc78a3d70a8f910
          filename: badge.json
          label: Custom Build
          message: ${{ env.status }}
          color: ${{ env.color }}
          namedLogo: github


